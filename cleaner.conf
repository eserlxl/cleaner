# AI assistant CLI and editor caches. These trees grow without bound: transcripts,
# generated media and cached data accumulate per session and are never pruned by the
# tools themselves. Everything below carries a 30-day age filter, so only material
# older than a month is reclaimed and a recent session stays resumable. Pure caches
# are "safe"; transcripts, edit history and generated content are "medium" because
# they are records, not regenerable cache.
#
# Deliberately NOT targeted, and they must not be added:
#   - $HOME/.config/Cursor/User/globalStorage/state.vscdb and its .backup, and
#     $HOME/.codex/*.sqlite -- live SQLite state stores. Their mtime makes a live
#     database look like stale data to an age filter; deleting one discards the
#     application's whole state, not a cache.
#   - any */context-mode directory -- an FTS5 index its own tooling purges; removing
#     the files out from under it corrupts the index.
#   - any extensions/ tree -- installed software, not cache.
#   - $HOME/.config/Claude/vm_bundles -- the local-agent VM disk image. Its mtime
#     makes a live 11 GB artifact look stale to an age filter, and deleting it
#     while the VM runs corrupts it. Reclaim it by hand instead, with the VM shut
#     down; the pristine rootfs.img.zst sits beside it, so the VM rebuilds locally.
#   - $HOME/.hermes/state.db and its -wal -- a live SQLite state store.
#   - $HOME/.config/Cursor/User/History and anything else under $HOME/.config that
#     stores user state. That directory is configuration and persistent state, so it
#     is rejected by default; only a leaf directory whose whole contents the
#     application regenerates (CachedData, logs) is exempted. User/History records a
#     resource path and edit history per file -- an editor recovery feature, not a
#     cache -- so it stays out of the default every install receives.
medium|Codex Sessions|$HOME/.codex/sessions|Codex CLI conversation transcripts|30|codex|
medium|Codex Generated Images|$HOME/.codex/generated_images|Codex CLI generated image output|30|codex|
medium|Claude Projects|$HOME/.claude/projects|Claude Code session transcripts|30|claude|
medium|Cursor Chats|$HOME/.cursor/chats|Cursor chat transcripts|30|cursor|
medium|Grok Sessions|$HOME/.grok/sessions|Grok CLI conversation transcripts|30|grok|
medium|Grok Downloads|$HOME/.grok/downloads|Grok CLI downloaded artifacts|30|grok|
safe|Cursor Cached Data|$HOME/.config/Cursor/CachedData|Cursor compiled-code and WASM cache|30|cursor|
safe|Antigravity Cached Data|$HOME/.config/Antigravity/CachedData|Antigravity compiled-code and WASM cache|30|antigravity|
safe|Antigravity Logs|$HOME/.config/Antigravity/logs|Antigravity rotated editor logs|30|antigravity|
safe|Claude Desktop Cache|$HOME/.config/Claude/Cache|Claude Desktop network and asset cache|30|claude|
safe|Claude Desktop Code Cache|$HOME/.config/Claude/Code Cache|Claude Desktop V8 compiled-code cache|30|claude|
safe|Claude Desktop Logs|$HOME/.config/Claude/logs|Claude Desktop rotated logs|30|claude|
safe|Codex Desktop CRX Cache|$HOME/.config/Codex/component_crx_cache|Codex Desktop component extension cache|30|codex|
safe|Codex Desktop GPU Cache|$HOME/.config/Codex/GPUPersistentCache|Codex Desktop GPU shader cache|30|codex|
safe|Hermes Cache|$HOME/.hermes/cache|Hermes agent cache|30|hermes|
safe|Hermes Logs|$HOME/.hermes/logs|Hermes agent rotated logs|30|hermes|

# Local source tree: per-project build output. These live outside HOME, so they
# require --allow-outside-home. The ** component spans nesting levels, so one line
# covers every project regardless of how deeply it sits; -prune semantics mean a
# build directory nested inside another is not listed twice. Rated medium: the
# output is fully regenerable, but reclaiming it costs a full rebuild.
# Selected by contents, not by name. A bare "build*" also matches directories that
# merely start with "build": source trees (test/core/builder), library sources
# inside node_modules (date-fns buildMatchFn, @babel/types builders), and a build/
# that holds documentation. Deleting part of node_modules is worse than deleting
# all of it -- npm cannot tell the package is incomplete, so it breaks at runtime
# instead of being reinstalled. filter:cxx_build keeps only a directory that holds
# a build-system marker, so the pattern can stay broad without matching source.
medium|C++ Build Dirs|/opt/lxl/c++/**/build*|Per-project build output|14||filter:cxx_build
medium|C++ CMake Build Dirs|/opt/lxl/c++/**/cmake-build*|Per-project CMake build output|14||filter:cxx_build

# Note: The Pacman cache targets reside outside the user's HOME directory.
# They require the --allow-outside-home command line flag to be processed.
medium|Pacman Cache (Keep 1)|/var/cache/pacman/pkg|Retains latest version of package cache using paccache|0||action:paccache_keep1

# The target below is highly aggressive and is commented out by default. Uncomment to use.
# danger|Pacman Cache (Purge All)|/var/cache/pacman/pkg|Purges all cached packages not currently installed using pacman|0||action:pacman_clean

# Portable cross-distro: uncomment only your distro's section; others skip cleanly.
# Cross-distro package-cache actions, commented out by default. Uncomment the one
# for your distro; like the pacman targets they live outside HOME and require the
# --allow-outside-home flag.
# medium|APT Cache Clean|/var/cache/apt/archives|Clears downloaded APT package archives (sudo apt-get clean)|0||action:apt_clean
# medium|DNF Cache Clean|/var/cache/dnf|Clears DNF caches (sudo dnf clean all)|0||action:dnf_clean
# medium|Zypper Cache Clean|/var/cache/zypp|Clears zypper caches (sudo zypper clean -a)|0||action:zypper_clean
