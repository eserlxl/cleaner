# Configuration for Linux Cleaner
# Target format: "NAME;PATH_EXPRESSION;DESCRIPTION"
# Environment variables like $HOME, $USER, etc., in PATH_EXPRESSION will be expanded at runtime.

TARGETS=(
  "NPM Cache;$HOME/.npm/_cacache;NPM dependency cache files"
  "Gemini Temp;$HOME/.gemini/tmp;Gemini temporary/scratch files"
  "Aurman Cache;$HOME/.cache/aurman;Aurman AUR helper package cache"
  "Yarn Cache;$HOME/.cache/yarn;Yarn package manager cache files"
)
