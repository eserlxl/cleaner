# AI assistant CLI and editor caches. These trees grow without bound: transcripts,
# generated media and cached data accumulate per session and are never pruned by the
# tools themselves. Everything below carries an age filter, so a recent session
# stays resumable. Pure caches are "safe"; transcripts, edit history and generated
# content are "medium" because they are records, not regenerable cache.
#
# Append-only records (transcripts, generated output, rotated logs) keep a 7-day
# filter and no CHECK_PROCESSES: the file a live session writes always has a fresh
# mtime, so the age filter alone protects it, and these tools run nearly all the
# time, so a process gate would block the target forever. Rows whose old-mtime
# files a running application holds open (Electron caches, the VM image) keep
# their process gate.
#
# Deliberately NOT targeted, and they must not be added:
#   - $HOME/.claude/projects -- Claude Code session transcripts. Claude Code prunes
#     them itself, per session (cleanupPeriodDays, 30 days by default), and keeps a
#     live session's sidecar directory (subagents/, tool-results/) together with its
#     transcript. A file-age filter cannot: a session open for longer than the age
#     limit has a fresh transcript but old sidecar files, and deleting those breaks
#     that session. The tree also holds durable per-project memory/ files.
#   - AI tool instruction and memory files (AGENTS.md, CLAUDE.md, GEMINI.md,
#     .cursorrules, rules/*.mdc, memory stores) -- configuration, not cache.
#   - $HOME/.config/Cursor/User/globalStorage/state.vscdb and its .backup, and
#     $HOME/.codex/*.sqlite -- live SQLite state stores. Their mtime makes a live
#     database look like stale data to an age filter; deleting one discards the
#     application's whole state, not a cache.
#   - any */context-mode directory -- an FTS5 index its own tooling purges; removing
#     the files out from under it corrupts the index.
#   - any extensions/ tree -- installed software, not cache.
#   - $HOME/.config/Claude/vm_bundles -- the local-agent VM disk image. Its mtime
#     makes a live 11 GB artifact look stale to an age filter, and deleting it
#     while the VM runs corrupts it. Reclaim it by hand instead, with the VM shut
#     down; the pristine rootfs.img.zst sits beside it, so the VM rebuilds locally.
#   - $HOME/.hermes/state.db and its -wal -- a live SQLite state store.
#   - $HOME/.config/Cursor/User/History and anything else under $HOME/.config that
#     stores user state. That directory is configuration and persistent state, so it
#     is rejected by default; only a leaf directory whose whole contents the
#     application regenerates (CachedData, logs) is exempted. User/History records a
#     resource path and edit history per file -- an editor recovery feature, not a
#     cache -- so it stays out of the default every install receives.
medium|Codex Sessions|$HOME/.codex/sessions|Codex CLI conversation transcripts|7||
medium|Codex Generated Images|$HOME/.codex/generated_images|Codex CLI generated image output|7||
medium|Cursor Chats|$HOME/.cursor/chats|Cursor chat transcripts|7||
medium|Grok Sessions|$HOME/.grok/sessions|Grok CLI conversation transcripts|30|grok,grok-desktop|
