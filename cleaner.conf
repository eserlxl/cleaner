# Local source tree: per-project build output. These live outside HOME and are
# cleaned with the other safe targets. The ** component spans nesting levels, so
# one line covers every project regardless of how deeply it sits; -prune semantics
# mean a build directory nested inside another is not listed twice. Rated safe:
# the output is fully regenerable.
# Selected by contents, not by name. A bare "build*" also matches directories that
# merely start with "build": source trees (test/core/builder), library sources
# inside node_modules (date-fns buildMatchFn, @babel/types builders), and a build/
# that holds documentation. Deleting part of node_modules is worse than deleting
# all of it -- npm cannot tell the package is incomplete, so it breaks at runtime
# instead of being reinstalled. filter:cxx_build keeps only a directory that holds
# a build-system marker, so the pattern can stay broad without matching source.
# For filter:cxx_build rows, MIN_AGE_DAYS is an idle threshold for the directory as
# a whole: a build directory is removed whole only when nothing in it changed for
# 14 days; active builds are never touched (per-file age deletion would strip
# configure-time files and leave a broken half tree).
safe|C++ Build Dirs|/opt/**/build*|Per-project build output|14||filter:cxx_build
safe|C++ CMake Build Dirs|/opt/**/cmake-build*|Per-project CMake build output|14||filter:cxx_build

# Local source tree: per-project AI tool logs. A project's .codex, .claude, .cursor,
# .gemini, .remember, .planwright and .qb directories otherwise hold configuration,
# rules, skills, plans and memory -- durable state an age filter would destroy -- so
# only their log leaves are targeted, never the tool directory itself. Like the
# home-directory transcript rows, these carry no CHECK_PROCESSES: the log a running
# tool appends to has a fresh mtime, so the age filter alone spares it.
# .remember/logs keeps a one-year filter: its memory files sit outside logs/ and are
# never targeted, and the plugin already rolls logs/ into monthly archives, so only
# archives older than a year are reclaimed.
safe|Gemini Project Debug Logs|/opt/**/.gemini/model_debug_logs|Per-project Gemini CLI model debug logs|7||
safe|Codex Project Logs|/opt/**/.codex/logs|Per-project Codex logs|7||
safe|Remember Project Logs|/opt/**/.remember/logs|Per-project Remember plugin logs and log archives|365||

# Note: The Pacman cache targets reside outside the user's HOME directory.
# Outside-HOME targets are allowed. These rows stay medium risk and need root.
medium|Pacman Cache (Keep 1)|/var/cache/pacman/pkg|Retains latest version of package cache using paccache|0||action:paccache_keep1

# The target below is highly aggressive and is commented out by default. Uncomment to use.
# danger|Pacman Cache (Purge All)|/var/cache/pacman/pkg|Purges all cached packages not currently installed using pacman|0||action:pacman_clean

# Portable cross-distro: uncomment only your distro's section; others skip cleanly.
# Cross-distro package-cache actions, commented out by default. Uncomment the one
# for your distro; like the pacman targets they live outside HOME (always allowed)
# and need root. They stay medium risk, so the safe-tier timer does not select them.
# medium|APT Cache Clean|/var/cache/apt/archives|Clears downloaded APT package archives (sudo apt-get clean)|0||action:apt_clean
# medium|DNF Cache Clean|/var/cache/dnf|Clears DNF caches (sudo dnf clean all)|0||action:dnf_clean
# medium|Zypper Cache Clean|/var/cache/zypp|Clears zypper caches (sudo zypper clean -a)|0||action:zypper_clean
# medium|APK Cache Clean|/var/cache/apk|Clears Alpine apk package cache (sudo apk cache clean)|0||action:apk_clean
