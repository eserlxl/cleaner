# Configuration for Linux Cleaner
# Format: RISK_LEVEL|NAME|PATH_EXPRESSION|DESCRIPTION|MIN_AGE_DAYS|CHECK_PROCESSES|CUSTOM_ACTION
#
# RISK_LEVEL: safe, medium, danger (default level is "safe")
# MIN_AGE_DAYS: (Optional) Delete files modified more than N days ago. Use 0 or empty to delete the whole directory/file.
# CHECK_PROCESSES: (Optional) Comma-separated process names. Skip target if any of them are currently running.
# CUSTOM_ACTION: (Optional) Predefined action to run instead of direct path deletion (e.g. action:paccache_keep3).

safe|NPM Cache|$HOME/.npm/_cacache|NPM dependency cache files|0|node,npm|
safe|Gemini Temp|$HOME/.gemini/tmp|Gemini temporary/scratch files|7|gemini|
safe|Aurman Cache|$HOME/.cache/aurman|Aurman AUR helper package cache|0|aurman|
safe|Yarn Cache|$HOME/.cache/yarn|Yarn package manager cache files|0|yarn,node|
medium|Chromium Cache|$HOME/.cache/chromium|Chromium browser cache files|3|chromium|
medium|Chromium mail.ru IndexedDB|$HOME/.config/chromium/Default/IndexedDB/https_my.mail.ru_0.indexeddb.leveldb|mail.ru site database storage|0|chromium|
safe|Clangd Cache|$HOME/.cache/clangd|clangd index files for C/C++ projects|14|clangd|
safe|TypeScript Cache|$HOME/.cache/typescript|TypeScript compiler/language server caches|7|node,tsserver|
safe|Prettier Cache|$HOME/.cache/prettier|Prettier code formatting cache|7|node|
safe|Nvidia Compute Cache|$HOME/.nv/ComputeCache|NVIDIA GPU shader/compute cache|0||
safe|Mesa Shader Cache|$HOME/.cache/mesa_shader_cache|Mesa open-source GPU shader cache|0||
safe|VSCode C++ Cache|$HOME/.cache/vscode-cpptools|VSCode C/C++ extension database cache|14|code|
medium|System Trash|$HOME/.local/share/Trash|Desktop environment system trash bin|30||
safe|Legacy Thumbnails|$HOME/.thumbnails|Desktop thumbnail cache (legacy)|14||
safe|Modern Thumbnails|$HOME/.cache/thumbnails|Desktop thumbnail cache (modern)|14||
safe|Pip Cache|$HOME/.cache/pip|Python pip package installer cache|30|pip,pip3|
safe|Go Build Cache|$HOME/.cache/go-build|Go compiler build cache|14|go|
medium|Cargo Registry Cache|$HOME/.cargo/registry/cache|Cargo crate download cache|30|cargo|
medium|Firefox Cache|$HOME/.cache/mozilla/firefox|Firefox browser cache files|7|firefox|
medium|Chrome Cache|$HOME/.cache/google-chrome|Google Chrome browser cache files|7|chrome,google-chrome|

# Note: The Pacman cache targets reside outside the user's HOME directory.
# They require the --allow-outside-home command line flag to be processed.
safe|Pacman Cache (Keep 3)|/var/cache/pacman/pkg|Retains latest 3 versions of package cache using paccache|0||action:paccache_keep3

# The target below is highly aggressive and is commented out by default. Uncomment to use.
# danger|Pacman Cache (Purge All)|/var/cache/pacman/pkg|Purges all cached packages not currently installed using pacman|0||action:pacman_clean
