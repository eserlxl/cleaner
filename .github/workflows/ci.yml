name: CI

on: [push, pull_request]

# Least-privilege: the gate only needs to read the checked-out source.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Lint with ShellCheck
        run: make lint

      - name: Run the safety test suite
        run: make check
