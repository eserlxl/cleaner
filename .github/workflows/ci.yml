name: CI

on: [push, pull_request]

# Least-privilege: the gate only needs to read the checked-out source.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint with ShellCheck
        run: shellcheck cleaner.sh test_cleaner.sh install.sh release-notes.sh

      - name: Run the safety test suite
        run: bash test_cleaner.sh
