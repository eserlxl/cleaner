name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Least-privilege: only the release job needs write access to create the release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint with ShellCheck
        run: shellcheck cleaner.sh test_cleaner.sh install.sh release-notes.sh

      - name: Run the safety test suite
        run: make check

      # No fallback: if the tag has no changelog section, the release must FAIL rather
      # than publish an empty-bodied release. A published release cannot be cleanly
      # un-published, and the tag can never be deleted (see RELEASING.md).
      - name: Extract changelog notes for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./release-notes.sh extract "${TAG#v}" > release_notes.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --draft
